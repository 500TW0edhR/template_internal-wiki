<h2 id="sec-1">対象者</h2>
<p>ボールペンやコピー用紙などの消耗品が必要な、すべての社員。</p>
<h2 id="sec-2">手順</h2>
<ol><li>総務部の発注フォームに入力する</li><li>毎週水曜日に、まとめて発注される</li><li>金曜日に届く</li></ol>
<h2 id="sec-3">注意点</h2>
<ul><li>5000円を超えるものは、上長の承認が必要です</li></ul>
